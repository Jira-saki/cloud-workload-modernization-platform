apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/cloud-workload-modernization-platform.git
    targetRevision: HEAD
    path: kubernetes/platform/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/cloud-workload-modernization-platform.git
    targetRevision: HEAD
    path: kubernetes/platform/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
