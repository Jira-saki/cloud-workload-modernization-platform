apiVersion: v1
kind: Service
metadata:
  name: demo-service
  namespace: demo-workload
  labels:
    app.kubernetes.io/name: demo-service
    tenant: demo
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: demo-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-service-netpol
  namespace: demo-workload
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
