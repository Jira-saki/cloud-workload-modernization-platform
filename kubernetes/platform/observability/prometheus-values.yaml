# Helm values configuration for kube-prometheus-stack
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'security-slack'
      routes:
        - match:
            severity: critical
          receiver: 'security-pager'
    receivers:
      - name: 'security-slack'
        webhook_configs:
          - url: 'http://alert-notifier.monitoring.svc:8080/webhook'
      - name: 'security-pager'
        webhook_configs:
          - url: 'http://alert-notifier.monitoring.svc:8080/pager'

grafana:
  enabled: true
  adminPassword: "admin-change-me"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
